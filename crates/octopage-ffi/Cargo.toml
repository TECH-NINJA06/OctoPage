[package]
name = "octopage-ffi"
description = "OctoPage's C ABI: a shared library and a C header (include/octopage.h)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
# The shared library C programs link against, and an rlib for the tests. Add "staticlib" for a
# static archive.
crate-type = ["cdylib", "rlib"]

[dependencies]
octopage = { path = "../octopage" }
octopage-git = { path = "../octopage-git" }
octopage-pagestore = { path = "../octopage-pagestore" }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[dev-dependencies]
cc = "1.2"
octopage-testkit = { path = "../octopage-testkit" }
tokio = { version = "1.53.1", features = ["full"] }
