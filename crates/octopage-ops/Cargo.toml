[package]
name = "octopage-ops"
description = "OctoPage maintenance: generation rollover, retention, integrity scans, repository hygiene, size projection, and the GitHub Actions workflows that run them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
fastrand = "2.5.0"
octopage = { path = "../octopage" }
octopage-git = { path = "../octopage-git" }
octopage-pagestore = { path = "../octopage-pagestore" }
octopage-sqlite = { path = "../octopage-sqlite" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time", "rt"] }
tracing = "0.1.44"

[dev-dependencies]
octopage-testkit = { path = "../octopage-testkit" }
tokio = { version = "1.53.1", features = ["full"] }
