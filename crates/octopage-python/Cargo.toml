[package]
name = "octopage-python"
description = "OctoPage for Python: a DB-API 2.0 style module over the Rust engine (PyO3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
# The extension module Python imports as octopage._octopage. The rlib makes `cargo test`
# build (and so refresh) the extension before the Python tests run.
name = "_octopage"
crate-type = ["cdylib", "rlib"]

[dependencies]
octopage = { path = "../octopage" }
octopage-pagestore = { path = "../octopage-pagestore" }
pyo3 = { version = "0.29.2", features = ["abi3-py39"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[features]
# Set by maturin when it builds a wheel: do not link libpython (Linux, macOS).
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
octopage-conformance = { path = "../octopage-conformance" }
octopage-testkit = { path = "../octopage-testkit" }
tokio = { version = "1.53.1", features = ["full"] }
