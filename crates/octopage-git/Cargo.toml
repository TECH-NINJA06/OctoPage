[package]
name = "octopage-git"
description = "Git objects, packfiles and the GitHub transport for OctoPage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
fastrand = "2.5.0"
flate2 = "1.1.10"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1-checked = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
octopage-testkit = { path = "../octopage-testkit" }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
