[package]
name = "octopage-pagestore"
description = "OctoPage's versioned page device: 4 KB pages in git blobs, a fan-out page map, commit by compare-and-swap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
fastrand = "2.5.0"
getrandom = "0.3.4"
hmac = "0.13.0"
lru = "0.18.5"
octopage-git = { path = "../octopage-git" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"
zeroize = "1.9.0"
zstd = "0.14.0"

[dev-dependencies]
octopage-testkit = { path = "../octopage-testkit" }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
