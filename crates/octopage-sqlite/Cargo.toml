[package]
name = "octopage-sqlite"
description = "SQLite on the OctoPage page store, through a VFS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fastrand = "2.5.0"
octopage-git = { path = "../octopage-git" }
octopage-pagestore = { path = "../octopage-pagestore" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
octopage-testkit = { path = "../octopage-testkit" }
tokio = { version = "1.53.1", features = ["full"] }
