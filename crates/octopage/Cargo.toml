[package]
name = "octopage"
description = "A relational database kept in a GitHub repository: SQLite on the OctoPage page store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
fastrand = "2.5.0"
hmac = "0.13.0"
octopage-git = { path = "../octopage-git" }
octopage-pagestore = { path = "../octopage-pagestore" }
octopage-sqlite = { path = "../octopage-sqlite" }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "encryption"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
md-5 = "0.10.6"
octopage-testkit = { path = "../octopage-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
