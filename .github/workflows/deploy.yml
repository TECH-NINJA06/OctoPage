name: deploy

# Deploy the service (and its dashboard) to Fly.io: by hand, or from the release workflow.
# Needs the repository secret FLY_API_TOKEN (`fly tokens create deploy`). The app, its volume
# and its secrets are made once by hand: docs/deploy.md.

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      FLY_API_TOKEN:
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build on Fly's builders and roll out
        run: flyctl deploy --remote-only --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the service answers
        run: |
          url="$(grep -m1 OCTOPAGE_PUBLIC_URL fly.toml | cut -d'"' -f2)"
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors "$url/readyz"
