name: ci

on:
  push:
  pull_request:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # The bindings', SDKs', browser build's and dashboard's tests run Node, Python and Chrome
      # (preinstalled on the runner).
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  spike-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Transport spike against a local git http-backend
        run: python3 spike/octospike.py selftest

  image:
    # The service's container image builds (what `fly deploy` builds).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag octopage-server .
