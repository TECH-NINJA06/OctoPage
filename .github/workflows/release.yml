name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  native:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64, ffi: liboctopage_ffi.so, node: liboctopage_node.so, exe: '' }
          - { os: macos-latest, platform: darwin-arm64, ffi: liboctopage_ffi.dylib, node: liboctopage_node.dylib, exe: '' }
          - { os: windows-latest, platform: win32-x64, ffi: octopage_ffi.dll, node: octopage_node.dll, exe: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build the CLI, the C library and the Node addon
        run: cargo build --release --locked -p octopage-cli -p octopage-ffi -p octopage-node
      - name: Package them
        shell: bash
        run: |
          set -euo pipefail
          out="dist/${{ matrix.platform }}"
          mkdir -p "$out/c" "$out/node"
          cp "target/release/octopage${{ matrix.exe }}" "$out/"
          cp "target/release/${{ matrix.ffi }}" crates/octopage-ffi/include/octopage.h "$out/c/"
          cp crates/octopage-node/{index.js,index.d.ts,package.json} "$out/node/"
          cp "target/release/${{ matrix.node }}" "$out/node/octopage.node"
          (cd dist && tar czf "octopage-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" "${{ matrix.platform }}")
      - uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.platform }}
          path: dist/*.tar.gz

  wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: aarch64, manylinux: '' }
          - { os: windows-latest, target: x64, manylinux: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/octopage-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../../dist
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdks:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: The TypeScript client
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm pack --pack-destination ../../dist
      - name: The Python client
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python --outdir dist
      - uses: actions/upload-artifact@v5
        with:
          name: sdks
          path: dist/*

  release:
    needs: [native, wheels, sdks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --generate-notes --draft

  publish:
    needs: release
    if: vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Pick the Python packages
        run: mkdir pypi && cp dist/*.whl dist/octopage_client-*.tar.gz pypi/
      - name: PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        run: npm publish dist/octopage-client-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy:
    needs: publish
    if: vars.PUBLISH == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
